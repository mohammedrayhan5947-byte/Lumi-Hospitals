services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: ${LUMI_DB_PASSWORD:?set LUMI_DB_PASSWORD}
      POSTGRES_DB: lumi_hospital
    ports:
      - "5432:5432"
    volumes:
      - lumi_hospital_db:/var/lib/postgresql/data

volumes:
  lumi_hospital_db:
